name: CI

on:
  pull_request:
    branches: [dev, main]

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Backend/frontend jobs below run `dotnet build`/`npm run build` directly from the repo root,
  # which never exercises the Dockerfile's own COPY/build-context rules -- so a change that's
  # only wrong from the Docker build's point of view (e.g. a file referenced by a project file
  # that the Dockerfile never copies into its build context) passes every other check here and
  # only fails once Railway actually builds and deploys it. Confirmed the hard way: PR #196 added
  # an EmbeddedResource the Dockerfile didn't COPY, passed this whole workflow, then failed on
  # Railway. This job runs the exact same `docker build` Railway does, so that class of failure
  # shows up as a normal PR check instead of a live deploy failure.
  docker-build:
    name: Docker build (Railway parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f Dockerfile .

  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        # Category=Contract tests hit the real ESPN/odds APIs over the network — excluded here,
        # run weekly + on-demand via espn-contract.yml instead.
        run: dotnet test --no-build -c Release --filter "Category!=Contract" --logger "console;verbosity=minimal"

  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client.React
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Client.React/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --run

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ''

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('Client.React/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: Client.React
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install chromium --with-deps
          fi

      - name: Playwright (mock-based tests)
        # webServer in playwright.config.ts auto-starts Vite when CI=true.
        # All API calls are intercepted by page.route() — no real backend needed.
        run: npm run test:e2e -- --project=chromium

  demo-e2e:
    name: Demo backend e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fourplay
          POSTGRES_PASSWORD: fourplay_local
          POSTGRES_DB: fourplay_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Client.React/package-lock.json

      - name: Build backend
        run: dotnet build -c Release

      - name: Start backend (DEMO_MODE)
        # UserManagerJob fires in 5s (DEMO_MODE fast-start), then DemoDataSeeder runs.
        # Output is captured to /tmp/backend.log — dumped on failure for diagnosis.
        run: |
          dotnet run --project Server --no-build -c Release --no-launch-profile \
            --urls http://localhost:5000 > /tmp/backend.log 2>&1 &
          echo "BACKEND_PID=$!" >> "$GITHUB_ENV"
        env:
          ConnectionStrings__POSTGRES_CONNECTION_STRING: "Host=localhost;Port=5432;Username=fourplay;Password=fourplay_local;Database=fourplay_dev"
          Jwt__Key: "ci-test-jwt-key-must-be-at-least-256-bits-long-for-hmacsha256"
          Jwt__Issuer: FourPlayWebAppClientDev
          Jwt__Audience: FourPlayWebAppClientDev
          Jwt__ExpiresMinutes: "1000"
          ADMIN_EMAIL: "admin@ci-demo.local"
          ADMIN_USERNAME: "ci-admin"
          ADMIN_PASSWORD: "CiAdmin@Test1!"
          APP_URL: "http://localhost:5174"
          DEMO_MODE: "true"
          ASPNETCORE_ENVIRONMENT: Development
          FOURPLAY_EMAIL_USER: "ci-noreply@example.com"
          FOURPLAY_EMAIL_PASS: "ci-dummy-not-used"

      - name: Install frontend deps
        working-directory: Client.React
        run: npm ci

      - name: Start frontend (NFL + CFB)
        working-directory: Client.React
        run: |
          VITE_API_TARGET=http://localhost:5000 npm run dev -- --port 5174 &
          echo "FRONTEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for demo stack to be ready
        # Poll until Alice can log in (backend + seeder done) AND Vite is serving at 5174.
        # With DEMO_MODE fast-start (5s delay), backend typically resolves in ~30s.
        run: |
          echo "Waiting for backend (seed) + Vite to be ready..."
          BACKEND_READY=0
          VITE_READY=0
          for i in $(seq 1 60); do
            if [ "$BACKEND_READY" -eq 0 ]; then
              RESULT=$(curl -s -X POST http://localhost:5000/api/auth/login \
                -H "Content-Type: application/json" \
                -d '{"username":"alice@demo.local","password":"DemoPass@123","rememberMe":false}' \
                2>/dev/null || echo '{}')
              if echo "$RESULT" | grep -q '"succeeded":true'; then
                echo "Backend ready after ~$((i * 3))s"
                BACKEND_READY=1
              fi
            fi
            if [ "$VITE_READY" -eq 0 ]; then
              if curl -s -o /dev/null -w "%{http_code}" http://localhost:5174 | grep -qE "^[23]"; then
                echo "Vite ready after ~$((i * 3))s"
                VITE_READY=1
              fi
            fi
            if [ "$BACKEND_READY" -eq 1 ] && [ "$VITE_READY" -eq 1 ]; then
              echo "Full demo stack ready after ~$((i * 3))s"
              exit 0
            fi
            echo "[$i/60] backend=$BACKEND_READY vite=$VITE_READY"
            sleep 3
          done
          echo "=== BACKEND LOG ==="
          cat /tmp/backend.log || echo "(no log)"
          exit 1

      - name: Dump backend log on failure
        if: failure()
        run: |
          echo "=== BACKEND LOG ==="
          cat /tmp/backend.log || echo "(no log)"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('Client.React/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: Client.React
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install chromium --with-deps
          fi

      - name: Playwright (demo integration tests)
        working-directory: Client.React
        run: npm run test:e2e:demo

      - name: Dump backend log on test failure
        if: failure()
        run: |
          echo "=== BACKEND LOG ==="
          cat /tmp/backend.log || echo "(no log)"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-demo-report
          path: Client.React/playwright-report/
          retention-days: 7

  demo-replay-e2e:
    name: Demo replay e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Job-level so both the backend-startup step and the Playwright step (which logs in as admin
    # via ADMIN_EMAIL/ADMIN_PASSWORD to drive /api/replay/advance and /api/replay/reset) see them.
    env:
      ADMIN_EMAIL: "admin@ci-demo.local"
      ADMIN_USERNAME: "ci-admin"
      ADMIN_PASSWORD: "CiAdmin@Test1!"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fourplay
          POSTGRES_PASSWORD: fourplay_local
          POSTGRES_DB: fourplay_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Client.React/package-lock.json

      - name: Build backend
        run: dotnet build -c Release

      - name: Start backend (DEMO_MODE + DEMO_REPLAY_MODE)
        # Same fast-start as demo-e2e's backend, plus DEMO_REPLAY_MODE so ReplayCacheService
        # backs the live-data endpoints/SSE streams instead of the static demo fixture.
        run: |
          dotnet run --project Server --no-build -c Release --no-launch-profile \
            --urls http://localhost:5000 > /tmp/backend-replay.log 2>&1 &
          echo "BACKEND_PID=$!" >> "$GITHUB_ENV"
        env:
          ConnectionStrings__POSTGRES_CONNECTION_STRING: "Host=localhost;Port=5432;Username=fourplay;Password=fourplay_local;Database=fourplay_dev"
          Jwt__Key: "ci-test-jwt-key-must-be-at-least-256-bits-long-for-hmacsha256"
          Jwt__Issuer: FourPlayWebAppClientDev
          Jwt__Audience: FourPlayWebAppClientDev
          Jwt__ExpiresMinutes: "1000"
          APP_URL: "http://localhost:5175"
          DEMO_MODE: "true"
          DEMO_REPLAY_MODE: "true"
          ASPNETCORE_ENVIRONMENT: Development
          FOURPLAY_EMAIL_USER: "ci-noreply@example.com"
          FOURPLAY_EMAIL_PASS: "ci-dummy-not-used"

      - name: Install frontend deps
        working-directory: Client.React
        run: npm ci

      - name: Start frontend (replay — NFL localhost + CFB cfb.localhost, port 5175)
        working-directory: Client.React
        run: |
          VITE_API_TARGET=http://localhost:5000 npm run dev -- --port 5175 &
          echo "FRONTEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for replay stack to be ready
        run: |
          echo "Waiting for backend (seed) + Vite to be ready..."
          BACKEND_READY=0
          VITE_READY=0
          for i in $(seq 1 60); do
            if [ "$BACKEND_READY" -eq 0 ]; then
              RESULT=$(curl -s -X POST http://localhost:5000/api/auth/login \
                -H "Content-Type: application/json" \
                -d '{"username":"alice@demo.local","password":"DemoPass@123","rememberMe":false}' \
                2>/dev/null || echo '{}')
              if echo "$RESULT" | grep -q '"succeeded":true'; then
                echo "Backend ready after ~$((i * 3))s"
                BACKEND_READY=1
              fi
            fi
            if [ "$VITE_READY" -eq 0 ]; then
              if curl -s -o /dev/null -w "%{http_code}" http://localhost:5175 | grep -qE "^[23]"; then
                echo "Vite ready after ~$((i * 3))s"
                VITE_READY=1
              fi
            fi
            if [ "$BACKEND_READY" -eq 1 ] && [ "$VITE_READY" -eq 1 ]; then
              echo "Full replay stack ready after ~$((i * 3))s"
              exit 0
            fi
            echo "[$i/60] backend=$BACKEND_READY vite=$VITE_READY"
            sleep 3
          done
          echo "=== BACKEND LOG ==="
          cat /tmp/backend-replay.log || echo "(no log)"
          exit 1

      - name: Dump backend log on failure
        if: failure()
        run: |
          echo "=== BACKEND LOG ==="
          cat /tmp/backend-replay.log || echo "(no log)"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('Client.React/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: Client.React
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install chromium --with-deps
          fi

      - name: Playwright (replay tests)
        working-directory: Client.React
        run: npm run test:e2e:replay

      - name: Dump backend log on test failure
        if: failure()
        run: |
          echo "=== BACKEND LOG ==="
          cat /tmp/backend-replay.log || echo "(no log)"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-replay-report
          path: Client.React/playwright-report/
          retention-days: 7
