<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Boot background + splash styles, inline so they paint before anything downloads. On a weak
         signal the bundled CSS can take a while; without this the installed iOS app sat on a plain
         white screen. Colors match global.css's --bg-2 (indexHtml.test.ts enforces it); :where()
         keeps these at the lowest specificity so global.css and CssBaseline take over untouched. -->
    <style>
      :where(body) { margin: 0; background-color: #f1f4f8; color: #0f172a; }
      :where(html[data-theme='dark']) body { background-color: #121a2f; color: #e2e8f0; }
      #boot-splash { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; font-family: system-ui, -apple-system, sans-serif; }
      #boot-splash .boot-spinner { width: 32px; height: 32px; border: 3px solid currentColor; border-right-color: transparent; border-radius: 50%; opacity: 0.5; animation: boot-spin 0.8s linear infinite; }
      /* Retry: theme.ts's primary filled button (main + contrastText) per mode — e2e-checked. */
      #boot-splash button { font: inherit; font-weight: 600; padding: 12px 24px; min-height: 44px; border: 0; border-radius: 8px; background: #1a2847; color: #fff; }
      :where(html[data-theme='dark']) #boot-splash button { background: #6366f1; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <!-- NFL (ivleague.xyz) and CFB (cfb.ivleague.xyz) are separate origins sharing this one
         build/index.html, so which manifest/home-screen icon/title applies has to be picked at
         runtime by hostname, not baked into a static tag — otherwise both sports' installed
         home-screen icons would be indistinguishable ("IV League" for both, same crest with no
         NFL/CFB badge). This duplicates the same hostname check src/services/sport.tsx's
         detectSport() and AppLayout.tsx's getOtherSportUrl() already do — deliberately, not an
         oversight: this script runs before any JS module loads (it has to append the manifest/
         apple-touch-icon links ASAP), so it can't import either of those. Keep the `cfb.` prefix
         check here in sync with theirs if that logic ever changes.
         manifest.json (NFL) and manifest.cfb.json (CFB) are intentionally near-duplicates —
         name/short_name/icons differ, everything else (theme_color, background_color) must
         match. JSON can't hold a same-file comment, so if you change one, change the other.
         apple-touch-icon-nfl.png/apple-touch-icon-cfb.png are the same base crest with a small
         "NFL"/"CFB" badge composited on — see icon-192/512(-maskable)-{nfl,cfb}.png for the same
         treatment used in the manifests above. -->
    <script>
      (function () {
        var isCfb = location.hostname.startsWith('cfb.');
        var manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = isCfb ? '/manifest.cfb.json' : '/manifest.json';
        document.head.appendChild(manifestLink);

        var appleTouchIconLink = document.createElement('link');
        appleTouchIconLink.rel = 'apple-touch-icon';
        appleTouchIconLink.href = isCfb ? '/apple-touch-icon-cfb.png' : '/apple-touch-icon-nfl.png';
        document.head.appendChild(appleTouchIconLink);

        var titleMeta = document.createElement('meta');
        titleMeta.name = 'apple-mobile-web-app-title';
        titleMeta.content = isCfb ? 'IV League CFB' : 'IV League NFL';
        document.head.appendChild(titleMeta);

        // Theme attribute before any CSS applies. ThemeModeProvider (services/theme.tsx) starts
        // from this and keeps it in sync afterwards; set only in that provider's effect, it landed
        // after first paint: dark-mode cold loads painted light, then faded. Same storage key as
        // THEME_STORAGE_KEY (themeMode.test.tsx enforces it).
        var mode = null;
        try { mode = localStorage.getItem('FourPlayWebApp.ThemeMode'); } catch (e) { /* storage blocked */ }
        if (mode !== 'dark' && mode !== 'light') {
          mode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', mode);
      })();
    </script>
    <!-- Mobile optimization for iOS and Android -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes, maximum-scale=5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1a2847" />


    <title>IV League</title>
    <!-- Static site-level preview for any shared link (invite links included). Some share targets
         (Slack, WhatsApp link cards, etc.) fetch the page and build their own rich preview from
         these tags independently of whatever text navigator.share() carried; with none defined
         that preview came back with no title/description/image at all. This can't carry a
         per-league name into the preview (that needs server-rendering the /join/:token route,
         which this doesn't attempt) but ensures every shared link previews as IV League instead
         of blank. See useShareLink.ts for the actual root cause of "share produced no message at
         all" — the clipboard fallback used when navigator.share isn't available was dropping the
         text message entirely, independent of these tags. -->
    <meta name="description" content="IV League is what fantasy football should have been — no draft, no waiver wire, no dead lineups. Pick NFL or college football games against the spread each week and watch the leaderboard." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IV League" />
    <meta property="og:title" content="IV League — Skip the Draft. Make Picks. Beat Your Friends." />
    <meta property="og:description" content="Pick games against the spread every week. All picks must hit to win — winners collect the pot from losers." />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="IV League — Skip the Draft. Make Picks. Beat Your Friends." />
    <meta name="twitter:description" content="Pick games against the spread every week. All picks must hit to win — winners collect the pot from losers." />
    <meta name="twitter:image" content="/icon-512.png" />
  </head>
  <body>
    <div id="root">
      <div id="boot-splash" data-testid="boot-splash">
        <strong style="font-size: 28px; letter-spacing: 0.04em">IV League</strong>
        <div class="boot-spinner" role="progressbar" aria-label="Loading"></div>
        <p id="boot-slow" hidden>Taking longer than usual — check your signal.</p>
        <button id="boot-retry" type="button" hidden>Retry</button>
      </div>
    </div>
    <script>
      // If the app still hasn't replaced the splash after 10s (a stalled download on a weak
      // signal), offer a way out instead of spinning forever. React mounting over #root removes
      // the splash, so this finds nothing to unhide once the app is up.
      (function () {
        var retry = document.getElementById('boot-retry');
        retry.addEventListener('click', function () { location.reload(); });
        setTimeout(function () {
          if (!document.getElementById('boot-splash')) return;
          document.getElementById('boot-slow').hidden = false;
          retry.hidden = false;
        }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
